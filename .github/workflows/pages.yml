# Publishes the browser playground, demo WAVs and landing page to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the standalone playground
        run: node js/build-standalone.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site/play _site/demos
          cp site/index.html _site/index.html
          cp js/index.html _site/play/index.html
          cp demos/*.wav _site/demos/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
